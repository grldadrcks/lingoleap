<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>

  <!-- Speech bubble body -->
  <rect x="130" y="170" width="680" height="490" rx="90" fill="white"/>
  <!-- Bubble tail -->
  <path d="M 260 660 L 170 830 L 420 660 Z" fill="white"/>

  <!-- Text lines (multilingual content symbol) -->
  <rect x="220" y="272" width="400" height="56" rx="28" fill="#10b981"/>
  <rect x="220" y="364" width="300" height="56" rx="28" fill="#10b981" opacity="0.55"/>
  <rect x="220" y="456" width="190" height="56" rx="28" fill="#10b981" opacity="0.28"/>

  <!-- Leap arc on the right -->
  <path d="M 660 540 C 700 420 730 290 660 210"
        stroke="#10b981" stroke-width="48" fill="none"
        stroke-linecap="round"/>
  <!-- Arrow head -->
  <path d="M 630 238 L 660 210 L 688 240"
        stroke="#10b981" stroke-width="48" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
